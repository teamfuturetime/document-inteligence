name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: '0.11.25'
          python-version: '3.13.14'
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            **/pyproject.toml
      - name: Install locked workspace
        run: uv sync --locked
      - name: Check Python schema export
        run: uv run --locked python -m backend.export_schemas --check
      - name: Run backend and sample integrity tests
        run: uv run --locked python -m pytest -q

  ocr:
    name: OCR integration
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: '0.11.25'
          python-version: '3.13.14'
      - name: Install Tesseract baseline
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y tesseract-ocr=5.3.4-1build5
          tesseract --version
      - name: Install locked workspace
        run: uv sync --locked
      - name: Install and verify pinned official models
        run: uv run --locked python -m document_pipeline.ocr_models --directory data/models/tessdata
      - name: Require real Vietnamese OCR and extraction tests
        run: uv run --locked python -m pytest -m ocr_integration --run-ocr --tessdata-dir=data/models/tessdata -q

  frontend:
    name: Frontend checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '26.5.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Run frontend tests
        run: npm test
      - name: Check generated contracts, typecheck and build
        run: npm run build
