name: Product CI
"on":
  pull_request:
    branches: [main, chore/repository-consolidation]
  push:
    branches: [main, chore/repository-consolidation]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: product-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  backend-checks:
    name: Backend checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # verified v5
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # verified v6
        with:
          version: "0.12.22"
          python-version: "3.14.5"
      - run: uv sync --project backend --locked
      - run: python3 scripts/dev.py backend-check
      - name: Verify bounded upload ingress over loopback HTTP
        run: uv run --project backend --locked python scripts/check_upload_ingress.py --output runtime/verification/upload-ingress-ci.json
  frontend-checks:
    name: Frontend checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # verified v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # verified v4
        with:
          node-version: "24.16.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm install --global npm@11.13.0
      - run: npm --prefix frontend ci
      - run: python3 scripts/dev.py frontend-check
  evaluation-checks:
    name: Evaluation regression
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # verified v5
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # verified v6
        with:
          version: "0.12.22"
          python-version: "3.14.5"
      - run: uv sync --project backend --locked
      - run: python3 scripts/dev.py evaluation-check
  ocr-integration:
    name: OCR integration
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # verified v5
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # verified v6
        with:
          version: "0.12.22"
          python-version: "3.14.5"
      - run: sudo apt-get update && sudo apt-get install --no-install-recommends -y tesseract-ocr
      - run: tesseract --version
      - run: uv sync --project backend --locked
      - run: python3 scripts/dev.py models
      - run: python3 scripts/dev.py ocr
      - name: Print native engine/model/config/source evidence
        run: cat runtime/verification/product-native.json
  browser-e2e:
    name: Browser E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # verified v5
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # verified v6
        with:
          version: "0.12.22"
          python-version: "3.14.5"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # verified v4
        with:
          node-version: "24.16.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm install --global npm@11.13.0
      - run: sudo apt-get update && sudo apt-get install --no-install-recommends -y tesseract-ocr
      - run: uv sync --project backend --locked
      - run: python3 scripts/dev.py models
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend exec -- playwright install --with-deps chromium
      - run: python3 scripts/dev.py e2e
  product-checks:
    name: Product checks
    if: ${{ always() }}
    needs: [backend-checks, frontend-checks, evaluation-checks, ocr-integration, browser-e2e]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every product job to succeed, including docs-only PRs
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os
          results = json.loads(os.environ['JOB_RESULTS'])
          failed = {job: value['result'] for job, value in results.items() if value['result'] != 'success'}
          if len(results) != 5 or failed:
              raise SystemExit(f'Product checks blocked: {failed or "missing jobs"}')
          print('All five product checks succeeded')
          PY
