name: Tính năng hoặc công việc
description: Đề xuất hạng mục có scope và acceptance rõ.
body:
  - type: textarea
    id: problem
    attributes:
      label: Vấn đề cần giải quyết
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope, requirement IDs và mã backlog
      description: FOUNDATION hay MVP; phạm vi có/ngoài và nguồn yêu cầu.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Input/output và acceptance criteria
    validations:
      required: true
  - type: textarea
    id: checks
    attributes:
      label: Kiểm tra dự kiến và dependencies
    validations:
      required: true
