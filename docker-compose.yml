services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-documents}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-documents}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-documents}
      AI_SERVICE_URL: http://ai_service:8001
      STORAGE_PATH: /app/storage/uploads
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key}
    ports:
      - "8000:8000"
    volumes:
      - uploads:/app/storage/uploads
    depends_on:
      db:
        condition: service_healthy
      ai_service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  ai_service:
    build:
      context: .
      dockerfile: ai_service/Dockerfile
    environment:
      OCR_ENGINE: ${OCR_ENGINE:-tesseract}
      OCR_LANG: ${OCR_LANG:-vie}
      OCR_PSM_MODES: ${OCR_PSM_MODES:-3,4,6,11}
      OCR_MAX_ATTEMPTS: ${OCR_MAX_ATTEMPTS:-3}
      PDF_DPI: ${PDF_DPI:-250}
      OCR_FALLBACK_ENABLED: ${OCR_FALLBACK_ENABLED:-false}
      MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB:-10}
      MAX_PDF_PAGES: ${MAX_PDF_PAGES:-20}
      MAX_IMAGE_PIXELS: ${MAX_IMAGE_PIXELS:-40000000}
    ports:
      - "8001:8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  uploads:
