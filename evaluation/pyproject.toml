[project]
name = "document-evaluation"
version = "0.1.0"
description = "Pipeline evaluation package for AI-02"
requires-python = ">=3.11"
dependencies = ["document-pipeline", "document-contracts"]

[tool.uv.sources]
document-pipeline = { workspace = true }
document-contracts = { workspace = true }

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/document_evaluation"]
