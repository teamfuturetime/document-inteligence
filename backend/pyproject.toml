[project]
name = "document-backend"
version = "0.1.0"
description = "FastAPI application for AI-02"
requires-python = ">=3.11"
dependencies = ["document-contracts", "document-pipeline"]

[tool.uv.sources]
document-contracts = { workspace = true }
document-pipeline = { workspace = true }

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/document_backend"]
