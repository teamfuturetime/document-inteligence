[project]
name = "docintel"
version = "0.1.0"
description = "Nền Document Intelligence AI-02; chưa có OCR thật"
requires-python = ">=3.14,<3.15"
dependencies = [
  "fastapi==0.142.2",
  "pydantic==2.13.5",
  "pydantic-settings==2.15.0",
  "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
  "pytest==9.1.1",
  "httpx2==2.13.1",
  "ruff==0.16.10",
  "pillow==12.3.0",
  "jsonschema==4.26.0",
  "pyyaml==6.0.3",
]

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/docintel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
