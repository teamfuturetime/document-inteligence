[project]
name = "document-contracts"
version = "1.0.0"
description = "Shared Pydantic wire contracts for AI-02"
requires-python = ">=3.11"
dependencies = ["pydantic==2.13.4"]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/document_contracts"]
