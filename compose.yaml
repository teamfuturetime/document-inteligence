services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DOCINTEL_PROVIDER_MODE: ${DOCINTEL_PROVIDER_MODE:-unconfigured}
    ports:
      - "127.0.0.1:8000:8000"
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      - backend
