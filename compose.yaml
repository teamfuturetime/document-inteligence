services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DOCINTEL_PROVIDER_MODE: tesseract
      DOCINTEL_TESSDATA_DIR: /opt/docintel-models
      DOCINTEL_RUNTIME_DIR: /app/runtime
    volumes:
      - document-runtime:/app/runtime
    ports:
      - "127.0.0.1:8000:8000"
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  document-runtime:
