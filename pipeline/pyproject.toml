[project]
name = "document-pipeline"
version = "0.1.0"
description = "AI-02 image, Tesseract OCR and evidence-based field extraction"
requires-python = ">=3.11"
dependencies = ["pydantic==2.13.5", "pillow==12.3.0"]

[project.scripts]
document-infer = "document_pipeline.cli:main"

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/document_pipeline"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
