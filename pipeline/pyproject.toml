[project]
name = "document-pipeline"
version = "0.1.0"
description = "Framework-independent OCR and extraction package for AI-02"
requires-python = ">=3.11"
dependencies = ["document-contracts"]

[tool.uv.sources]
document-contracts = { workspace = true }

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/document_pipeline"]
