[project]
name = "ai02-solo"
version = "0.1.0"
description = "Independent Vietnamese invoice and application document review"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.143.0", "pydantic==2.13.4", "pillow==12.3.0",
  "pymupdf==1.28.2", "python-multipart==0.0.32", "uvicorn==0.54.0",
]

[dependency-groups]
dev = ["pytest==8.4.2", "httpx2==2.13.0"]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/src/ai02_solo"]

[tool.uv]
workspace = { members = [] }

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
addopts = "--strict-markers"
markers = ["native: real OCR; requires SOLO_TESSDATA_DIR"]
