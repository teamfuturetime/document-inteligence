<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#161c1a" />
    <script>
      (() => {
        let saved
        try { saved = localStorage.getItem('ai02-solo-theme-v1') } catch {}
        const theme = saved === 'light' || saved === 'dark' ? saved
          : matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
        document.documentElement.dataset.theme = theme
        document.documentElement.style.colorScheme = theme
        document.querySelector('meta[name="theme-color"]').content = theme === 'light' ? '#f3f5ef' : '#161c1a'
      })()
    </script>
    <meta name="description" content="Trích xuất hóa đơn và đơn từ tiếng Việt, rà soát từng trường và xuất JSON đã kiểm tra. Ứng dụng AI-02 Solo dành cho dữ liệu mẫu và tổng hợp." />
    <meta name="page-type" content="software" />
    <title>AI-02 Solo · Rà soát tài liệu tiếng Việt</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  </head>
  <body><noscript><p class="no-script">Bật JavaScript để tải tài liệu, rà soát kết quả OCR và xuất JSON trong AI-02 Solo.</p></noscript><div id="root"></div><script type="module" src="/src/main.tsx"></script></body>
</html>
